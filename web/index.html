<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>specli</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <img class="logo logo-light" src="logo-full-light.svg" alt="specli" width="87" height="30" />
        <img class="logo logo-dark" src="logo-white.svg" alt="" width="87" height="30" />
        <button id="new" class="primary" title="Create a new file" hidden>+ New</button>
      </div>
      <input id="filter" type="search" placeholder="Filter files / search text (Ctrl+K)" autocomplete="off" />
      <nav id="tree"></nav>
      <div id="foot"></div>
    </aside>
    <main>
      <header id="toolbar">
        <span id="title">No file selected</span>
        <span id="dirty" title="Unsaved changes" hidden>●</span>
        <span class="spacer"></span>
        <button id="theme" title="Theme: auto (click to change)">◐</button>
        <div class="seg" id="modes">
          <button data-mode="edit">Editor</button>
          <button data-mode="split">Split</button>
          <button data-mode="preview">Preview</button>
        </div>
        <button id="save" class="primary" hidden>Save</button>
      </header>
      <div id="banner" hidden></div>
      <div id="panes" class="mode-split" hidden>
        <div id="editor"></div>
        <div id="preview"><div id="pv-error" hidden></div><div id="pv-body"></div></div>
      </div>
      <div id="empty">
        <img class="logo-light" src="logo-full-light.svg" alt="specli" width="232" height="80" />
        <img class="logo-dark" src="logo-full-dark.svg" alt="" width="232" height="80" />
        <p>Select a file on the left.</p>
      </div>
    </main>
  </div>
  <dialog id="new-dlg" aria-labelledby="new-title">
    <form method="dialog" id="new-form" autocomplete="off">
      <h2 id="new-title">New file</h2>
      <div class="nd-types" id="new-types" role="radiogroup" aria-label="File type"></div>
      <label class="nd-field">Folder
        <input id="new-dir" list="new-dirs" placeholder="(project root)" spellcheck="false" />
        <datalist id="new-dirs"></datalist>
      </label>
      <label class="nd-field">Name
        <input id="new-name" placeholder="design" spellcheck="false" />
      </label>
      <p class="nd-path">Creates <code id="new-path"></code></p>
      <p class="nd-error" id="new-error" hidden></p>
      <div class="nd-actions">
        <button type="button" id="new-cancel">Cancel</button>
        <button type="submit" class="primary" id="new-create">Create</button>
      </div>
    </form>
  </dialog>
  <dialog id="git-dlg" aria-labelledby="git-title">
    <form method="dialog" id="git-form" autocomplete="off">
      <h2 id="git-title">Changes <span id="git-branch"></span></h2>
      <label class="gd-all"><input type="checkbox" id="git-all" /> <span id="git-count"></span></label>
      <div id="git-list" class="gd-list"></div>
      <textarea id="git-msg" rows="3" placeholder="Commit message" spellcheck="true"></textarea>
      <p class="nd-error" id="git-error" hidden></p>
      <p class="gd-ok" id="git-ok" hidden></p>
      <div class="nd-actions">
        <button type="button" id="git-close">Close</button>
        <button type="submit" class="primary" id="git-commit">Commit</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
